# Contract fixture (#5, Slice 6): text that pushes a layout. Long titles, a long word with
# no break in it, long paragraphs, and long list items; titles in non-Latin scripts, each
# section and item marking its own language; and two sections, and two items, with the same
# title, whose ids must still differ.
schemaVersion: 2
locale: en
direction: ltr

identity:
  name: Kiri Longfellow-Ashbourne-Whitcombe-Ravensworth-Thistlewaite
  tagline: Writes at length about writing at length, and about almost everything else as well

