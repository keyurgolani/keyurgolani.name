    label: https://longtext.test/an/unusually/deep/path/that/keeps/going/and/going/until/it/stops

sections:
  - kind: hero
    id: top
    tagline: >-
      A tagline long enough to wrap across three or four lines on a phone, and maybe two on a
      wide screen, without ever pushing the page wider than the window it sits in
    subtagline: Supercalifragilisticexpialidociousantidisestablishmentarianismpneumonoultramicroscopicsilicovolcanoconiosis

  - kind: lede
    id: about
    title: >-
      About this portfolio, its author, the work, the long history of the work, and why the
      title of this section goes on for as long as it does
    body: |
      This paragraph is long on purpose. It runs on through clause after clause, the way a
      careful writer sometimes lets a sentence run when the thought it carries refuses to be
      cut short, and it keeps going so that a composition has to wrap it, measure it, and give
      it room without letting it spill past the edge of the screen or under a neighbor.

      A second paragraph follows the first, with a word that has no place to break in it:
      Llanfairpwllgwyngyllgogerychwyrndrobwllllantysiliogogogochllanfairpwllgwyngyllgogerychwyrndrobwll.

