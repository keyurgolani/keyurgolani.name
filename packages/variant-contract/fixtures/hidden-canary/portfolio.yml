# Contract fixture (#5, Slice 6): content no visitor may see. The site document hides three
# sections, and data from a content extension no host registers sits on the identity, a
# link, a section, an item, and in a section of its own. Each holds the marker canary-hidden,
# which must never reach the page, its RSC payload, or a render input, whichever
# composition renders it. .test hosts only.
schemaVersion: 2
locale: en
direction: ltr

identity:
  name: Robin Hidden
  tagline: Shows only what's ready
  extensions:
    '@other/portfolio-x':
      note: canary-hidden-identity

links:
  - platform: website
    url: https://hidden.test
    label: Website
    extensions:
      '@other/portfolio-x':
        note: canary-hidden-link

sections:
  - kind: hero
    id: top
    tagline: Some of this page is still a draft.

  - kind: experience
    id: roles-draft
    title: canary-hidden-roles
    items:
      - role: canary-hidden-role
        organization: canary-hidden-organization
        period: { start: '2025-01' }

  - kind: experience
    id: work
    title: Work
    items:
      - role: Staff engineer
        organization: Calm Co
        period: { start: '2023-04' }
        extensions:
          '@other/portfolio-x':
            note: canary-hidden-item

  - kind: skills
    id: skills-draft
    title: canary-hidden-skills
    items: [canary-hidden-skill]

  - kind: writings
    id: essays
    title: Essays
    extensions:
      '@other/portfolio-x':
        note: canary-hidden-section
    items:
      - title: Notes on visible things
        url: https://hidden.test/visible
        publishedAt: '2026-01-02'
        summary: An essay every visitor sees.

  - kind: writings
    id: drafts
    title: canary-hidden-title
    items:
      - title: canary-hidden-essay
        url: https://hidden.test/canary-hidden-url
        publishedAt: '2026-02-03'
        summary: canary-hidden-summary

  - kind: '@other/portfolio-x/gallery'
    id: gallery
    title: canary-hidden-gallery
    data:
      items:
        - caption: canary-hidden-gallery-item

  - kind: contact
    id: contact
    title: Contact
