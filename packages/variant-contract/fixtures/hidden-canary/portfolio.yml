# Contract fixture (#5, Slice 6; #10): content no visitor may see. The site document hides
# eight sections, and data from a content extension no host registers sits on the identity, a
# link, a section, an item, and in a section of its own. Records only a hidden section lists,
# their media, the thesis and the other practice parts and the contact record only a hidden
# section places, and a hidden github section's snapshot are gone from the view too. So are
# private works, evidence, and media wherever they're named: in a visible section, on a
# visible work, in a custom item, and in the curation lists. snapshots/github.json holds the
# hidden section's record, and the visible github section's, whose excluded repository is
# gone too. Each holds a canary-hidden marker, in its id where it has one, which must never
# reach the page, its RSC payload, the feed, JSON-LD, or a render input, whichever
# composition renders it. Each visible section keeps one plain entry. .test hosts only.
schemaVersion: 3
locale: en
direction: ltr
identity:
  name: Robin Hidden
  tagline: Shows only what's ready
  extensions:
    '@other/portfolio-x':
      note: canary-hidden-identity
