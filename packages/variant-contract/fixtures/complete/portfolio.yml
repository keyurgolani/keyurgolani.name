# Contract fixture (#5, Slice 6; #10): every core section kind and every record
# type, with every field each defines: the curation lists, a case study with
# every field, every evidence type, every chronology kind with threads and
# links, media of every kind, and placements that override their asset. Each
# value is distinct, so a test can find it in the markup. Every image is a
# path under the media root with no file yet, so it renders as unavailable.
# Links go to .test hosts only, and the github section names an account and
# has no snapshot beside it.
