# Contract fixture (#5, Slice 6): every core section kind, with every field each kind
# defines, and every image bundled as a data URL, so nothing renders from outside the
# app. Each value is distinct, so a test can find it in the markup. Links go to .test
# hosts only, and the github section names an account and carries no GitHub data.
