    role: Author
    tools: [Go, Kubernetes]
    evidence: [shipyard-repository]
    links:
      - url: https://code.okafor.test/ines/shipyard
        label: Source
    highlights:
      - Runs 4,000 deploys a week
    caseStudy:
      challenge: Deploys took forty minutes and failed quietly, so teams batched changes and made each one riskier.
      role: I wrote shipyard and moved the first forty services onto it.
      decisions:
        - decision: Roll back on the canary's error budget, not on a timer.
          rationale: A timer rolls back healthy deploys and keeps bad ones that fail slowly.
      outcomes: Median deploy time fell from forty minutes to six, and teams deploy several times a day.
