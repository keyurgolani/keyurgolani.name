# Photography: a documentary photographer with a gallery, press, and prints.
# The signature is an image series with a short case study; an earlier series
# is archived and private, so it never shows; an exhibition is evidence.
schemaVersion: 3
locale: sv
direction: ltr
identity:
  name: Mateo Lindqvist
  tagline: Documentary photographer
  location: Gothenburg, Sweden
  email: mateo@lindqvist.test
  avatar:
    asset: portrait
links:
  - platform: instagram
    url: https://instagram.test/mateo
    label: Instagram
practice:
  thesis: I photograph the work that keeps a coast running, at the hours nobody else is there to see it.
  services:
    - items:
        - name: Editorial assignments
          description: Two-day shoots for magazines and newspapers.
          url: mailto:mateo@lindqvist.test
signature: harbors-series
proof: [nordic-documentary-prize, harbors-exhibition]
works:
  - id: harbors-series
    slug: harbors
    title: Harbors
    medium: image-series
    summary: Ten years of ferries, quays, and the crews who work them.
    period: { start: '2015' }
    evidence: [harbors-exhibition, the-quiet-coast]
    media:
      - asset: ferry-at-dawn
        caption: The 6:10 to Vinga
        takenAt: 2025-03
        location: Gothenburg
      - asset: nets-on-the-quay
        caption: Nets, Fiskebäckskil
        takenAt: 2024-08
    caseStudy:
      context: The west coast's working harbors, photographed through every season from 2015 on.
      reflection: The series became about time. The same quay reads differently every year it's still there.
  - id: first-winters
    title: First winters
    medium: photography
    summary: Early street photographs, kept for myself.
    visibility: private
evidence:
  - id: lindqvist-prints
    type: external-work
    title: Lindqvist Prints
    description: Limited editions of the harbor series.
    url: https://prints.lindqvist.test
