works:
  - id: canopy-drought-memory
    slug: canopy-drought-memory
    title: Canopy drought memory
    medium: research
    summary: A five-year program measuring how beech and oak canopies carry one drought into the next season.
    period: { start: 2021-10 }
    role: Principal investigator
    evidence: [drought-memory-in-temperate-canopies, erc-starting-grant]
    caseStudy:
      challenge: Growth models treat each year as new, so they miss forests that are still recovering.
      context: Forty plots across Saxony, instrumented under the canopy.
      role: I designed the sensor network and lead the group that runs it.
      outcomes: A drought-memory term that improves next-season growth forecasts in every plot we tested.
