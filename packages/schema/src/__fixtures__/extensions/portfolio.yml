# A portfolio using two content extensions: @acme/portfolio-photography,
# which tests register (see ../acme-portfolio-photography.ts), and
# @other/portfolio-music, which nothing registers. portfolio.json is its twin.
schemaVersion: 3
locale: en
direction: ltr
identity:
  name: Rowan Fixture
  extensions:
    "@acme/portfolio-photography":
      camera: Leica M6
      film: true
    "@other/portfolio-music":
      ensembles:
        - Quartet
        - Orchestra
      instrument: cello
works:
  - id: plates-2
    title: Plates
    medium: image-series
    media:
      - asset: plates-2-image
        caption: Harbor
media:
  - id: plates-2-image
    kind: image
    source: plates/harbor.jpg
    alt: A harbor at dawn
    extensions:
      "@acme/portfolio-photography":
        lens: 35mm
sections:
  - kind: works
    id: plates
    title: Plates
    items:
      - plates-2
  - kind: "@acme/portfolio-photography/exhibitions"
    id: exhibitions
    title: Exhibitions
    data:
      items:
        - city: Nowhere
          title: Low Tide
          url: https://harbor.test/low-tide
          venue: Harbor Gallery
          year: 2024
  - kind: "@other/portfolio-music/releases"
    id: releases
    title: Releases
    data:
      albums:
        - name: First Light
          tracks: 9
