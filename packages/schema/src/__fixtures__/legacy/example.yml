  # ── Projects ────────────────────────────────────────────────────────────
  - kind: projects
    title: Work Showcase
    items:
      - name: postmortem-template-kit
        summary: An opinionated, batteries-included template kit for writing better incident postmortems.
        description: |
          Three years of running postmortem reviews convinced me that the *template* is doing most of the work. This kit ships with twelve
          templates spanning availability, latency, security, and process incidents, plus a CLI that walks an author through the questions
          that don't get asked enough — *what was the smallest signal that was missed* and *what did the room assume that wasn't true*.

          Used at a dozen mid-size engineering teams and one government agency I'm not allowed to name.
        period:
          start: 2022-01
        role: Author and maintainer
        technologies: [TypeScript, Bun, Markdown]
        image:
          src: https://picsum.photos/seed/postmortem-kit/640/420
          alt: Screenshot of the postmortem CLI tool
          credit: ''
        links:
          - url: https://github.com/anamika/postmortem-template-kit
            label: GitHub
          - url: https://postmortems.example.com
            label: Project site
        highlights:
          - 3,200+ GitHub stars
          - Cited in three SREcon talks
          - Plain-language explainer in The Pragmatic Engineer
      - name: small-traces
        summary: A minimalist tracing library for understanding latency in serverless workloads — designed for legibility over completeness.
        description: |
          OpenTelemetry is a wonderful thing, but for the kind of system where you have eleven cold-started Lambdas and you want to know
          *which one* spent fourteen seconds doing nothing, it is overkill. small-traces ships in 800 lines of TypeScript, has zero
          dependencies, and prints traces as ASCII flame graphs.
        period:
          start: 2024-06
        role: Author
        technologies: [TypeScript, AWS Lambda]
        image:
          src: https://picsum.photos/seed/small-traces/640/420
          alt: ASCII flame graph rendered in a terminal
        links:
          - url: https://github.com/anamika/small-traces
            label: GitHub
      - name: chaos-curriculum
        summary: A four-week curriculum for teaching engineering teams how to run their first chaos-engineering experiment safely.
        description: |
          Written for teams with no game-day tradition — emphasis on "what could go wrong" rather than "what went wrong." Includes
          facilitator notes, a sample blast-radius worksheet, and three case studies.
        role: Curriculum author
        technologies: [Curriculum design, Markdown]
        links:
          - url: https://example.com/chaos-curriculum
            label: Read the curriculum

