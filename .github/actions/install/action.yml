# Node, pnpm through Corepack, and a frozen install, with the pnpm store
# restored and saved under the lockfile's hash. Every ci.yml check job
# installs through it after its checkout.
#
# Only the store is cached: never node_modules, and never a generated
# registry, which a fixture-flag build could have written with fixture packs
# in it. publish and any release job install without this action, so no cache
# ever feeds a published artifact. A cache written by a PR run stays on that
# PR's ref, and one written on main is read-only to PRs.
name: install
description: Node, pnpm, and a frozen install with the pnpm store cached by the lockfile.
inputs:
  node-version:
    description: The Node release to set up, CI's NODE_VERSION.
    required: true
outputs:
  store-hit:
    description: "'true' when the store came back under this exact lockfile hash."
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Enable pnpm
      shell: bash
      run: corepack enable
    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    # An older store (another lockfile) still saves most downloads; the frozen
    # install fetches what it lacks and checks every package's integrity.
    - name: Restore the pnpm store
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Save the pnpm store
      if: ${{ steps.restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
