name: baseline-recapture

# The variants baselines of the shots one commit's first capture couldn't settle, captured again on
# CI Linux, never merged. It runs on a push of a baseline-recapture branch alone. That branch is the
# commit plus one commit, which moves those shots' committed baselines aside, empties
# baseline-pending.json, gives a missing baseline's capture the time a tall page needs, records each
# shot's rendered look, and adds this file and _capture/. Each attempt runs ci.yml's variants steps
# on those tests alone (_capture/projects.txt and grep.txt), and recollect keeps a shot only when
# every attempt wrote it with the same bytes. Read-only, no secrets, and nothing it uploads is a build.
on:
  push:
    branches: ['kgn-a/baseline-recapture-dde207a9b']

permissions:
  contents: read

concurrency:
  group: baseline-recapture-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # As ci.yml's: the Node release the image ships.
  NODE_VERSION: 22.23.4
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ci.yml's variants job, step for step, on the watched tests alone, once an attempt. A red is
  # expected: every baseline it writes fails its test. The step reports its status rather than
  # failing, so the upload always runs, and recollect judges the files.
  capture:
    name: capture (${{ matrix.attempt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        attempt: [3, 4, 5]
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    env:
      PORTFOLIO_SCREENSHOTS: compare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As ci.yml's install, which keeps the ./ form: the pinned actionlint rejects `$/`.
      - name: Install
        uses: ./.github/actions/install # zizmor: ignore[self-repository]
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The build job's Next cache, restored only, under ci.yml's own key.
      - name: Restore the Next build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: "next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/scripts/**', 'apps/web/public/**', 'apps/web/*.ts', 'apps/web/*.json', 'packages/*/src/**', 'packages/*/packs/**', 'packages/*/*.json', 'package.json', 'tsconfig.base.json', 'pnpm-workspace.yaml', '.npmrc', '*.example.yml', 'example-media/**', 'snapshots/**') }}"
          restore-keys: "next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-"
      - name: pnpm ci:build
        run: pnpm ci:build
      - name: Capture the watched shots, attempt ${{ matrix.attempt }}
        shell: bash
        run: |
          mkdir -p capture-out
          export CAPTURE_LOOKS="$PWD/capture-out/looks.jsonl"
          mapfile -t projects < _capture/projects.txt
          # The watched tests, exactly: one test a watched shot, or the attempt stops here.
          want=$(grep -c . _capture/watch.txt)
          pnpm exec playwright test --config tests/variants/playwright.config.ts --list "${projects[@]}" --grep "$(cat _capture/grep.txt)" > capture-out/list.txt 2>&1 || true
          grep -E '^Total: ' capture-out/list.txt || true
          grep -q -E "^Total: $want tests? in " capture-out/list.txt || { echo "the watch list doesn't list $want tests"; exit 1; }
          status=0
          pnpm exec playwright test --config tests/variants/playwright.config.ts --retries=0 "${projects[@]}" --grep "$(cat _capture/grep.txt)" || status=$?
          echo "$status" > capture-out/status.txt
          # The baselines this attempt wrote are the untracked PNGs: every other baseline is committed.
          mkdir -p capture-out/shots
          git status --porcelain --untracked-files=all -- tests/variants/__screenshots__ | sed -n 's/^?? //p' | grep '\.png$' | while read -r f; do cp "$f" capture-out/shots/; done || true
          echo "The attempt ended $status with $(find capture-out/shots -name '*.png' | wc -l) baselines written: recollect judges the files."
      - name: Upload the shots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-${{ matrix.attempt }}
          path: capture-out/
          if-no-files-found: error
          retention-days: 1

  # Every attempt against the others, shot by shot, and each against the first capture's shas. One
  # artifact holds the shots every attempt wrote with the same bytes and manifest.tsv; the job
  # summary names the rest.
  collect:
    name: collect
    needs: [capture]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Download the captures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: capture-*
          path: ${{ runner.temp }}/capture
      - name: Recollect
        run: node _capture/recollect.mjs "$RUNNER_TEMP/capture" "$RUNNER_TEMP/baselines"
      - name: Upload the agreed baselines
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebaselines-dde207a9b
          path: ${{ runner.temp }}/baselines/
          if-no-files-found: error
          retention-days: 7
