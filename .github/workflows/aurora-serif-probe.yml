# Evidence only, never merged: which of Field Serif's and Paste-Up's faces moves what at load on CI
# Linux. One job, on a push of either probe branch alone (the head, and its base twin, which carries
# the same commit on the landing), in the browser job's pinned image after install and ci:build:
# _ci-evidence/aurora-serif-probe loads Aurora Glass on each pack (platform-neutral, warm-parchment,
# the pack, dark), script on, under reduced motion, as the load-shift pins do, and prints each load's
# layout-shift entries with each source's node, element, text, computed font and rects; then the same
# load with each of the pack's face files refused in turn, and with every face file but that one
# refused. The run's exit is data, printed; the job fails only on a listing of other than EV_COUNT
# tests. Holds contents: read and no secret, and reads no cache.
name: aurora-serif-probe

on:
  push:
    branches: [kgn/aurora-serif-probe, kgn/aurora-serif-probe-base]

permissions:
  contents: read

concurrency:
  group: aurora-serif-probe-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.4
  TZ: UTC

jobs:
  probe:
    name: aurora-serif-probe (Field Serif, Paste-Up, face by face)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    env:
      CI_REPORTS_DIR: reports/aurora-serif-probe
      EV_CONFIG: _ci-evidence/aurora-serif-probe/playwright.config.ts
      EV_COUNT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install, with no cache
        run: corepack enable && pnpm install --frozen-lockfile
      - name: pnpm ci:build
        run: pnpm ci:build
      - name: List the job's tests
        shell: bash
        run: |
          pnpm exec playwright test --config "$EV_CONFIG" --list > "$RUNNER_TEMP/list.txt" 2>&1 || true
          cat "$RUNNER_TEMP/list.txt"
          total=$(awk '/^Total: [0-9]+ tests? in /{n=$2} END{if (n == "") print "unread"; else print n}' "$RUNNER_TEMP/list.txt")
          echo "[aurora-serif-probe] listed $total test(s); want exactly $EV_COUNT"
          [ "$total" = "$EV_COUNT" ] || { echo "[aurora-serif-probe] FAIL: listed $total, not $EV_COUNT"; exit 1; }
      - name: Run them
        shell: bash
        run: |
          rc=0
          pnpm exec playwright test --config "$EV_CONFIG" --workers=1 --retries=0 || rc=$?
          echo "[aurora-serif-probe] the probe exited $rc (data)"
      - name: Upload the evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aurora-serif-probe-${{ github.ref_name == 'kgn/aurora-serif-probe' && 'head' || 'base' }}
          path: reports/aurora-serif-probe/
          if-no-files-found: ignore
          retention-days: 7
