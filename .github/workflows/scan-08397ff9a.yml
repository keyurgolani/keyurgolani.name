name: scan-08397ff9a

# The release scan's image check on one base image, before a candidate's tag: Grype on
# node:22.23.5-alpine at its multi-arch index digest, the Dockerfile's base at 08397ff9a, on
# linux/amd64 and linux/arm64, judged by ci/release/scan-gate.mjs image as release.yml's rc-scan
# judges a candidate. Never merged. It runs on a push of its own branch alone: the commit plus this
# file. The image is public on Docker Hub, so the job logs in nowhere; it reads the repository and
# uploads the scan's reports, and nothing else.
on:
  push:
    branches: ['kgn-proof/scan-08397ff9a']

permissions:
  contents: read

concurrency:
  group: scan-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # As release.yml's: the Node release the image ships, and the platforms rc-scan scans.
  NODE_VERSION: 22.23.5
  TZ: UTC
  PLATFORMS: linux/amd64,linux/arm64
  # The Dockerfile's three FROM lines at 08397ff9a.
  BASE_IMAGE: node:22.23.5-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a

jobs:
  # release.yml's rc-scan, its image steps as they are, with the base image in place of the
  # candidate's digest: no GHCR login and no packages permission, and no dependency scan, which
  # ci.yml's deps-scan runs on the same lockfile.
  scan:
    name: scan (node:22.23.5-alpine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the commit
    env:
      REPORTS: reports/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Grype
        run: |
          node ci/release/install-grype.mjs "$RUNNER_TEMP/grype"
          echo "$RUNNER_TEMP/grype" >> "$GITHUB_PATH"
      - name: Scan the image
        run: |
          mkdir -p "$REPORTS"
          for platform in ${PLATFORMS//,/ }; do
            grype -q "registry:$BASE_IMAGE" --platform "$platform" -o json --file "$REPORTS/grype-image-${platform//\//-}.json"
          done
          node ci/release/scan-gate.mjs image "$REPORTS"/grype-image-*.json --report="$REPORTS/image-scan.md"
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-scan-08397ff9a
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
