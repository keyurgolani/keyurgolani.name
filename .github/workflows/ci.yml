# The one CI workflow. `gate` is the only required check: it fails unless this
# is a complete run and every job it needs succeeded, so new jobs join by
# being added to its `needs` and to `selected`'s.
#
# `changes` (ci/select-jobs.mjs) picks the jobs a run needs. A draft PR runs
# only the jobs its changed paths select, for fast feedback, and `selected`
# reports on them; gate fails a draft's run by design, and GitHub refuses to
# merge a draft. A PR that's ready for review, a PR into main, and a push run
# the complete product on every head, so gate's pass always covers the whole
# product on the merge commit it ran. Each check job waits on `changes` and
# runs when the selection names it; a job that skips that wiring just always
# runs.
#
# Every check step runs one `pnpm ci:<job>` script, or a shard of one
# (ci/shards.mjs), which is also its local command. On a push to main, after `gate` passes, `publish` pushes the
# multi-arch image by digest, smoke-tests both platforms from that digest, and
# tags it sha-<short>. Nothing publishes from a PR or another branch.
name: ci

on:
  pull_request:
    branches: [main, next]
    # ready_for_review starts the complete run gate needs on a draft's head.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR cancels its superseded runs. A push gets one group per commit, so no
  # push run is ever cancelled.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Node release the image ships: the Dockerfile's node:X.Y.Z tag.
  # pnpm check:pins fails when the two differ.
  NODE_VERSION: 22.23.3
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: '1'
  REPORT_RETENTION_DAYS: ${{ github.event_name == 'pull_request' && 14 || 90 }}

jobs:
  # The selection: which check jobs this run needs, and whether that's the
  # complete product (ci/select-jobs.mjs). On a PR the checkout is the merge
  # commit, so its first parent is the base tip and the diff is the merge's.
  # Pure Node on the runner's own, so it needs no install.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      complete: ${{ steps.select.outputs.complete }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select jobs
        id: select
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.base_ref }}
        run: node ci/select-jobs.mjs --github

  static:
    name: static
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'static') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      - name: Install workflow linters
        id: linters
        run: |
          node ci/install-workflow-linters.mjs "$RUNNER_TEMP/workflow-linters"
          echo "$RUNNER_TEMP/workflow-linters" >> "$GITHUB_PATH"
      # Each check runs even when an earlier one failed, so one run reports all.
      - name: pnpm ci:format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ci:format
      - name: pnpm ci:lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ci:lint
      - name: pnpm ci:typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ci:typecheck
      - name: pnpm ci:skills
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ci:skills
      - name: pnpm ci:registry
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ci:registry
      - name: pnpm ci:appearance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ci:appearance
      - name: pnpm ci:deps
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ci:deps
      - name: pnpm ci:pins
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ci:pins
      - name: pnpm ci:workflows
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.linters.outcome == 'success' }}
        run: pnpm ci:workflows
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-static
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  # `pnpm test` in three shards, split by workspace package and root test
  # script on their measured durations (ci/shards.mjs,
  # ci/shard-durations.json). Together they run exactly what `pnpm ci:unit`
  # runs.
  unit:
    name: unit (${{ matrix.shard }}/3)
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'unit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      - name: pnpm test:shard unit ${{ matrix.shard }}/3
        env:
          SHARD: ${{ matrix.shard }}/3
          CI_REPRO_COMMAND: pnpm test:shard unit ${{ matrix.shard }}/3
        run: node ci/run.mjs unit -- node ci/shards.mjs run unit "$SHARD"
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-unit-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  build:
    name: build
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'build') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      # Next's own cache, keyed by the lockfile and the hash of every build
      # input, and only ever written by the plain build this job, browser,
      # and variants run: no fixture flag, no analyze build. It never holds
      # the generated registry, which each build writes fresh, and the image
      # and publish never read it.
      - name: Restore the Next build cache
        id: next-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/scripts/**', 'apps/web/public/**', 'apps/web/*.ts', 'apps/web/*.json', 'packages/*/src/**', 'packages/*/packs/**', 'packages/*/*.json', '*.example.yml', 'example-media/**', 'snapshots/**') }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Next build cache hit
        if: ${{ steps.next-cache.outputs.cache-hit == 'true' }}
        run: echo "Next build cache restored for these build inputs"
      - name: pnpm ci:build
        run: pnpm ci:build
      # The default build ships no browser source maps. Only the analyze
      # build pnpm test:trace reads has them (#6, ci/source-maps.test.mjs).
      - name: pnpm ci:source-maps
        run: pnpm ci:source-maps
      # The standalone output holds the bundled sample and nothing the image
      # scan refuses: no other portfolio or site document, no snapshot but
      # the sample's, and no test tree, so none of a contract fixture's
      # files, since the image copies it whole (#5, #7,
      # ci/standalone.test.mjs).
      - name: pnpm ci:standalone
        run: pnpm ci:standalone
      # The site and preview pages load the Markdown post-pass, and no
      # browser chunk carries sanitize-html (#10, ci/markdown-pass.test.mjs).
      - name: pnpm ci:markdown-pass
        run: pnpm ci:markdown-pass
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-build
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  # The browser suite in two shards, split by spec file on measured
  # durations (ci/shards.mjs). Each shard builds, then runs its files.
  browser:
    name: browser (${{ matrix.shard }}/2)
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'browser') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Browsers come baked into the image, at the version @playwright/test pins.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      # Playwright's container guidance: the host IPC namespace so Chromium
      # has enough shared memory, and an init process to reap children.
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image ships Node 24; the app under test runs on the image's Node 22.
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      # The build job's Next cache (see there).
      - name: Restore the Next build cache
        id: next-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/scripts/**', 'apps/web/public/**', 'apps/web/*.ts', 'apps/web/*.json', 'packages/*/src/**', 'packages/*/packs/**', 'packages/*/*.json', '*.example.yml', 'example-media/**', 'snapshots/**') }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Next build cache hit
        if: ${{ steps.next-cache.outputs.cache-hit == 'true' }}
        run: echo "Next build cache restored for these build inputs"
      - name: pnpm ci:build
        run: pnpm ci:build
      - name: pnpm test:shard browser ${{ matrix.shard }}/2
        env:
          SHARD: ${{ matrix.shard }}/2
          CI_REPRO_COMMAND: pnpm test:shard browser ${{ matrix.shard }}/2
        run: node ci/run.mjs browser -- node ci/shards.mjs run browser "$SHARD"
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-browser-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  # The route specs (#5, Slice 4) need variants that declare path views, so
  # they build a fixture host of their own: a copy of the workspace with
  # test-only variants from tests/fixtures/variants/ installed, linked offline
  # from the store this job's install fills. Nothing in the checkout is built.
  routes:
    name: routes
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'routes') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      - name: pnpm ci:routes
        run: pnpm ci:routes
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-routes
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  # The appearance specs (#19, Slice 3) need the fixture packs and the
  # /_fixtures/appearance page, which only a build made with
  # APPEARANCE_FIXTURES=1 has, so they build a fixture host of their own, as
  # the route specs do: a copy of the workspace built with that flag, linked
  # offline from the store this job's install fills. Nothing in the checkout
  # is built.
  appearance-browser:
    name: appearance-browser
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'appearance-browser') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      - name: pnpm ci:appearance-browser
        run: pnpm ci:appearance-browser
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-appearance-browser
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  # The variant source audit (#5, Slice 3): registry generation, then every
  # registered variant's code and styles, and the kit modules they reach.
  check-variants:
    name: check-variants
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'check-variants') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      - name: pnpm ci:check-variants
        run: pnpm ci:check-variants
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-check-variants
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  # The variant specs (#5, Slice 6): every registered composition on every
  # contract fixture and on the bundled sample, in six modes, with the hidden
  # canary and render parity, against this checkout's build. Screenshots
  # compare against tests/variants/__screenshots__/ here, in the pinned
  # image, and nowhere else. A missing baseline fails the job, which writes
  # it and uploads it in the variants-screenshots artifact to be committed.
  # In two shards, split by Playwright project (one per composition and
  # fixture, plus the modes' own checks) on measured durations.
  variants:
    name: variants (${{ matrix.shard }}/2)
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'variants') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    env:
      PORTFOLIO_SCREENSHOTS: compare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      # The build job's Next cache (see there).
      - name: Restore the Next build cache
        id: next-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/scripts/**', 'apps/web/public/**', 'apps/web/*.ts', 'apps/web/*.json', 'packages/*/src/**', 'packages/*/packs/**', 'packages/*/*.json', '*.example.yml', 'example-media/**', 'snapshots/**') }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Next build cache hit
        if: ${{ steps.next-cache.outputs.cache-hit == 'true' }}
        run: echo "Next build cache restored for these build inputs"
      - name: pnpm ci:build
        run: pnpm ci:build
      - name: pnpm test:shard variants ${{ matrix.shard }}/2
        env:
          SHARD: ${{ matrix.shard }}/2
          CI_REPRO_COMMAND: pnpm test:shard variants ${{ matrix.shard }}/2
        run: node ci/run.mjs variants -- node ci/shards.mjs run variants "$SHARD"
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-variants-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}
      - name: Upload screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: variants-screenshots-${{ matrix.shard }}
          path: tests/variants/__screenshots__/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  # The reference third-party variant (#5, Slice 6), packed from
  # tests/external-variant/ and installed from its tarball in a temporary
  # git worktree, linked from the store this job's install fills (the add
  # and the remove may read package metadata from the registry), then
  # checked and removed. The worktree builds its own host twice; nothing in
  # the checkout is built.
  external-variant:
    name: external-variant
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'external-variant') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      - name: pnpm ci:external-variant
        run: pnpm ci:external-variant
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-external-variant
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  # The offline docs check (ci/docs-check.mjs): every relative link and
  # anchor in the repository's Markdown resolves, and every `pnpm <script>`
  # it names exists. Pure Node, so no install. The scheduled workflow checks
  # external links weekly. It writes its own job summary, since the failure
  # summary needs the install this job skips.
  docs:
    name: docs
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'docs') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: pnpm ci:docs
        run: node ci/run.mjs docs -- node ci/docs-check.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-docs
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  image:
    name: image
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.jobs), 'image') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: portfolio:ci
      IMAGE_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        id: install
        uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm store cache hit
        if: ${{ steps.install.outputs.store-hit == 'true' }}
        run: echo "pnpm store restored under this lockfile's hash"
      # Builds amd64 without pushing, starts the container, and checks health.
      - name: pnpm ci:image
        id: image
        run: pnpm ci:image
      - name: pnpm ci:proxy
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: pnpm ci:proxy
        env:
          PORTFOLIO_IMAGE: ${{ env.IMAGE_TAG }}
      # #2's security suite under owner, through the same HTTPS proxy.
      - name: pnpm ci:security-proxy
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: pnpm ci:security-proxy
        env:
          PORTFOLIO_IMAGE: ${{ env.IMAGE_TAG }}
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-image
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}

  # A draft's feedback: every selected job succeeded and the rest were
  # skipped. Never required; gate is.
  selected:
    name: selected
    if: ${{ always() }}
    needs:
      [
        changes,
        static,
        unit,
        build,
        browser,
        routes,
        appearance-browser,
        check-variants,
        variants,
        external-variant,
        image,
        docs,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/gate.mjs
          sparse-checkout-cone-mode: false
      - name: Require every selected job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node ci/gate.mjs --selected

  # The one required check: a complete run where every job succeeded.
  gate:
    name: gate
    if: ${{ always() }}
    needs:
      [
        changes,
        static,
        unit,
        build,
        browser,
        routes,
        appearance-browser,
        check-variants,
        variants,
        external-variant,
        image,
        docs,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/gate.mjs
          sparse-checkout-cone-mode: false
      - name: Require a complete run where every needed job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node ci/gate.mjs

  # Builds amd64 and arm64 once, pushes the result by digest with no tag,
  # smoke-tests each platform pulled from that digest, and only then tags the
  # same digest sha-<short>. The main tag is retired, and latest moves only
  # with final release tags.
  publish:
    name: publish
    needs: [gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read # check out the commit
      packages: write # push the image to GHCR
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      # Empty when the secret isn't set, which skips the Docker Hub steps.
      # The Docker Hub secrets move into a `publish` environment once the owner
      # creates it; until then they stay repository secrets.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} # zizmor: ignore[secrets-outside-env]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # arm64 builds and runs under QEMU until native arm64 runners replace it.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          cache-binary: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # zizmor: ignore[secrets-outside-env]
          password: ${{ secrets.DOCKERHUB_TOKEN }} # zizmor: ignore[secrets-outside-env]
      - name: Compute labels and the sha tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
          flavor: |
            latest=false
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
      - name: pnpm ci:image (linux/amd64, pushed digest)
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          IMAGE_PLATFORM: linux/amd64
        run: pnpm ci:image
      - name: pnpm ci:image (linux/arm64, pushed digest)
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          IMAGE_PLATFORM: linux/arm64
          SMOKE_TIMEOUT_MS: '300000'
        run: pnpm ci:image
      # Docker Hub, if configured, gets the same digest.
      - name: Tag the tested digest sha-<short>
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.meta.outputs.version }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_USERNAME && format('docker.io/{0}/{1}', env.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
        run: |
          targets=("$IMAGE_NAME:$TAG")
          if [ -n "$DOCKERHUB_IMAGE" ]; then targets+=("$DOCKERHUB_IMAGE:$TAG"); fi
          for target in "${targets[@]}"; do
            docker buildx imagetools create --tag "$target" "$IMAGE_NAME@$DIGEST"
            pushed=$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$pushed" != "$DIGEST" ]; then
              echo "::error title=publish::$target resolves to $pushed, not the tested $DIGEST"
              exit 1
            fi
            echo "$target -> $DIGEST"
          done
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-publish
          path: reports/
          if-no-files-found: ignore
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}
