# The inventory run (row 151 and the v1.0.0 plan, the coordinator's ruling, 2026-11-11): the
# release scope (c′) run whole, as a release candidate's quality gate runs it, to say what fails
# before a candidate is cut. It holds no release job: no build, scan, tag or promote.
#
# It runs on a push of a kgn-a/inventory-* branch alone: no tag, and no dispatch, which only the
# default branch's workflows take. inventory-plan counts (c′)'s release plan
# (quality/inventory/scope.json, an empty records list) as rc-quality-plan does, and hands its
# shards to inventory-1 to inventory-3, release.yml's rc-quality-1 to -3 step for step but for
# their names, scope file and artifacts: three matrices of at most 256, 6, 5 and 5 at a time, at
# rc-quality's 120 minutes, at the worker count quality/inventory/workers.json names, which the
# worker probe settles and the release run keeps too. Each shard's reports upload for three days.
# inventory-summary merges every shard (tests/quality/inventory.ts): failures counted by
# composition, rule, check and viewport, with their record keys. It never gates on a records
# list; it fails only when a shard is missing or a report doesn't hold its tests.
#
# While a run of this file is in flight, scheduled.yml's big-run pauses the nightly (ci/big-run.mjs
# finds it by this file's path), so its 16 never stand beside the nightly's 16. It holds contents:
# read and no secret, reads no cache, and installs fresh.
name: inventory

on:
  push:
    branches: ['kgn-a/inventory-*']

permissions:
  contents: read

concurrency:
  group: inventory
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.4
  TZ: UTC

jobs:
  inventory-plan:
    name: inventory-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      count: ${{ steps.count.outputs.count }}
      shards1: ${{ steps.count.outputs.shards1 }}
      shards2: ${{ steps.count.outputs.shards2 }}
      shards3: ${{ steps.count.outputs.shards3 }}
      workers: ${{ steps.workers.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install, with no cache
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Count the release plan's shards
        id: count
        env:
          # The inventory's scope, (c′) with an empty list (tests/quality/lib/release-scope.ts).
          QUALITY_RELEASE_SCOPE: quality/inventory/scope.json
        run: pnpm exec tsx tests/quality/full-plan.ts
      # The worker count every shard runs at, which the worker probe settles: one setting for the
      # release run and this one (quality/inventory/workers.json, held to SHARD_WORKERS).
      - name: The worker count
        id: workers
        run: |
          workers=$(node -p "require('./quality/inventory/workers.json').workers")
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "The inventory runs every shard at $workers Playwright worker(s) (quality/inventory/workers.json)." >> "$GITHUB_STEP_SUMMARY"

  inventory-1:
    name: inventory (${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }})
    needs: [inventory-plan]
    if: ${{ needs.inventory-plan.outputs.shards1 != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.inventory-plan.outputs.shards1) }}
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    env:
      # The image this job runs in, so the visual cells know they're in it.
      QUALITY_CONTAINER: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install, with no cache
        run: corepack enable && pnpm install --frozen-lockfile
      - name: pnpm ci:quality-full --shard=${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }}
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }}
          CI_REPRO_COMMAND: pnpm ci:quality-full --shard=${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }}
          QUALITY_CANARY_FILE: ${{ runner.temp }}/quality-canary
          QUALITY_SECRETS_FILE: ${{ runner.temp }}/quality-secrets
          QUALITY_RELEASE_SCOPE: quality/inventory/scope.json
        # It reports, and gates on no records list: a shard whose tests fail still uploads, and
        # inventory-summary counts its failures. A shard cut off fails the summary.
        run: |
          status=0
          pnpm ci:quality-full "--shard=$SHARD" || status=$?
          echo "The shard ended $status: inventory-summary counts its failures."
      # The reports upload only when this succeeds: it deletes what it can't
      # read, and fails when it did, or when the canary is still in any.
      - name: Scrub reports
        id: scrub
        if: ${{ always() }}
        run: node tests/quality/scrub.mjs
        env:
          QUALITY_CANARY_FILE: ${{ runner.temp }}/quality-canary
          QUALITY_SECRETS_FILE: ${{ runner.temp }}/quality-secrets
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-inventory-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          # Three days: the first wave's reports outlast the last wave's end, as rc-quality's.
          retention-days: 3

  inventory-2:
    name: inventory (${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }})
    needs: [inventory-plan]
    if: ${{ needs.inventory-plan.outputs.shards2 != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ${{ fromJSON(needs.inventory-plan.outputs.shards2) }}
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    env:
      # The image this job runs in, so the visual cells know they're in it.
      QUALITY_CONTAINER: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install, with no cache
        run: corepack enable && pnpm install --frozen-lockfile
      - name: pnpm ci:quality-full --shard=${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }}
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }}
          CI_REPRO_COMMAND: pnpm ci:quality-full --shard=${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }}
          QUALITY_CANARY_FILE: ${{ runner.temp }}/quality-canary
          QUALITY_SECRETS_FILE: ${{ runner.temp }}/quality-secrets
          QUALITY_RELEASE_SCOPE: quality/inventory/scope.json
        # It reports, and gates on no records list: a shard whose tests fail still uploads, and
        # inventory-summary counts its failures. A shard cut off fails the summary.
        run: |
          status=0
          pnpm ci:quality-full "--shard=$SHARD" || status=$?
          echo "The shard ended $status: inventory-summary counts its failures."
      # The reports upload only when this succeeds: it deletes what it can't
      # read, and fails when it did, or when the canary is still in any.
      - name: Scrub reports
        id: scrub
        if: ${{ always() }}
        run: node tests/quality/scrub.mjs
        env:
          QUALITY_CANARY_FILE: ${{ runner.temp }}/quality-canary
          QUALITY_SECRETS_FILE: ${{ runner.temp }}/quality-secrets
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-inventory-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          # Three days: the first wave's reports outlast the last wave's end, as rc-quality's.
          retention-days: 3

  inventory-3:
    name: inventory (${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }})
    needs: [inventory-plan]
    if: ${{ needs.inventory-plan.outputs.shards3 != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ${{ fromJSON(needs.inventory-plan.outputs.shards3) }}
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    env:
      # The image this job runs in, so the visual cells know they're in it.
      QUALITY_CONTAINER: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install, with no cache
        run: corepack enable && pnpm install --frozen-lockfile
      - name: pnpm ci:quality-full --shard=${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }}
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }}
          CI_REPRO_COMMAND: pnpm ci:quality-full --shard=${{ matrix.shard }}/${{ needs.inventory-plan.outputs.count }}
          QUALITY_CANARY_FILE: ${{ runner.temp }}/quality-canary
          QUALITY_SECRETS_FILE: ${{ runner.temp }}/quality-secrets
          QUALITY_RELEASE_SCOPE: quality/inventory/scope.json
        # It reports, and gates on no records list: a shard whose tests fail still uploads, and
        # inventory-summary counts its failures. A shard cut off fails the summary.
        run: |
          status=0
          pnpm ci:quality-full "--shard=$SHARD" || status=$?
          echo "The shard ended $status: inventory-summary counts its failures."
      # The reports upload only when this succeeds: it deletes what it can't
      # read, and fails when it did, or when the canary is still in any.
      - name: Scrub reports
        id: scrub
        if: ${{ always() }}
        run: node tests/quality/scrub.mjs
        env:
          QUALITY_CANARY_FILE: ${{ runner.temp }}/quality-canary
          QUALITY_SECRETS_FILE: ${{ runner.temp }}/quality-secrets
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-inventory-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          # Three days: the first wave's reports outlast the last wave's end, as rc-quality's.
          retention-days: 3

  # Every shard's reports merged into the inventory: what failed in (c′), by composition, rule,
  # check and viewport, with each record's key, in its artifact and the job summary. It runs
  # however the shards ended, once the plan counted them; it fails only when the shards aren't
  # the whole run (INVENTORY_GATES): a shard missing, or a report that doesn't hold its tests.
  inventory-summary:
    name: inventory-summary
    needs: [inventory-plan, inventory-1, inventory-2, inventory-3]
    if: ${{ !cancelled() && needs.inventory-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install, with no cache
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Download the shards' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-inventory-*
          path: ${{ runner.temp }}/inventory-shards
      - name: pnpm ci:inventory-summary
        env:
          SHARDS: ${{ runner.temp }}/inventory-shards
          SHARD_COUNT: ${{ needs.inventory-plan.outputs.count }}
        run: pnpm ci:inventory-summary "$SHARDS" --shards "$SHARD_COUNT"
      - name: Upload the inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-summary
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
