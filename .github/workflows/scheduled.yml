# Scheduled checks across the whole product, outside any PR: every night,
# #11's quality matrix and #20's catalog cross-product, and on Mondays, the
# links check too. A failure opens or
# updates one rolling issue, and the first passing run in which every job ran,
# a Monday's, closes it (ci/report-issue.mjs).
#
# GitHub runs schedules only from the default branch, so this starts once it
# reaches main, and disables a public repository's schedules after 60 days
# with no activity there. It has no manual trigger: test the reporter offline
# with `node --test ci/report-issue.test.mjs`.
#
# Every job sets timeout-minutes. A job that hits it is reported as
# cancelled or as failure, and the reporter counts anything but success as a
# failure, so nothing hangs or ages silently. The one exception is a skip
# report's EXPECTED_SKIPS names: links, on the nights it doesn't run. Only
# `report` holds `issues: write`.
#
# Cross-product jobs join here: #11's quality matrix (quality-full, judged
# whole by quality-verdict), #20's catalog cross-product (catalog-full),
# and #20's report-only catalog provenance refresh once its catalog
# exists. Each one
# sets timeout-minutes, uploads its reports as reports-<job>, runs its check
# as `pnpm ci:<job>` (the reporter names that as its local command), and goes
# into report's needs.
name: scheduled

on:
  schedule:
    # Mondays at 06:23 UTC: every job, links included. Only this run can
    # close the report, since every job runs in it.
    - cron: '23 6 * * 1'
    # Every other night at 06:23 UTC: every job but links. Monday is left
    # out, so the quality matrix runs once a night.
    - cron: '23 6 * * 0,2-6'

permissions:
  contents: read

concurrency:
  group: scheduled
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.4
  TZ: UTC

jobs:
  # The docs check, then every external link requested once. This job is the
  # one place CI reaches outside hosts on purpose; it never requests a local,
  # reserved, or live-site host (ci/docs-check.mjs).
  links:
    name: links
    # Mondays only. On the other nights it skips, and report's EXPECTED_SKIPS
    # names it, so that skip alone isn't a failure.
    if: ${{ github.event.schedule == '23 6 * * 1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: pnpm ci:docs
        run: node ci/run.mjs docs -- node ci/docs-check.mjs
      - name: pnpm ci:links
        if: ${{ !cancelled() }}
        run: node ci/run.mjs links -- node ci/docs-check.mjs --external
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-links
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  # #11's complete quality matrix: quality:full over every cell, viewport,
  # and preference row, the covering array's appearance rows, every pair the
  # [37] change-directed rule could plan, and the visual cells, against a
  # worktree with the reference variant installed from its tarball
  # (--external-variant), in six shards in the pinned Playwright image the
  # variants job uses. Each shard's reports are scrubbed of cookies,
  # Authorization, and CSRF values however the run ended, and upload only
  # when that scrub succeeds. A shard judges only what a shard can;
  # quality-verdict judges the run whole.
  quality-full:
    name: quality-full (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    env:
      # The image this job runs in, so the visual cells know they're in it.
      QUALITY_CONTAINER: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        # The install action from this same checkout; actionlint rejects the `$/` form.
        uses: ./.github/actions/install # zizmor: ignore[self-repository]
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm ci:quality-full --shard=${{ matrix.shard }}/6
        env:
          SHARD: ${{ matrix.shard }}/6
          CI_REPRO_COMMAND: pnpm ci:quality-full --shard=${{ matrix.shard }}/6
          QUALITY_CANARY_FILE: ${{ runner.temp }}/quality-canary
          QUALITY_SECRETS_FILE: ${{ runner.temp }}/quality-secrets
        run: pnpm ci:quality-full "--shard=$SHARD"
      # The reports upload only when this succeeds: it deletes what it can't
      # read, and fails when it did, or when the canary is still in any.
      - name: Scrub reports
        id: scrub
        if: ${{ always() }}
        run: node tests/quality/scrub.mjs
        env:
          QUALITY_CANARY_FILE: ${{ runner.temp }}/quality-canary
          QUALITY_SECRETS_FILE: ${{ runner.temp }}/quality-secrets
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() && steps.scrub.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-quality-full-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  # The sharded run's verdict, judged whole (tests/quality/lib/shards.ts):
  # zero tests, the plan's coverage, empty projects, the canary probe, and
  # registered targets with no result, across every shard together, and a
  # missing, unjudged, or mismatched shard. It runs however the shards
  # ended, and reads only the shards' scrubbed reports, downloaded into a
  # directory of their own.
  quality-verdict:
    name: quality-verdict
    needs: [quality-full]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        # The install action from this same checkout; actionlint rejects the `$/` form.
        uses: ./.github/actions/install # zizmor: ignore[self-repository]
        with:
          node-version: ${{ env.NODE_VERSION }}
      # A shard that uploaded nothing is the merge's missing-shard failure,
      # not this step's.
      - name: Download the shards' reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-quality-full-*
          path: ${{ runner.temp }}/quality-shards
      - name: pnpm ci:quality-verdict
        env:
          SHARDS: ${{ runner.temp }}/quality-shards
        run: pnpm ci:quality-verdict "$SHARDS" --shards 6 --mode full
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-quality-verdict
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  # #20's cross-product, in four shards in the pinned Playwright image
  # (tests/catalog/plan.ts). Each shard runs the static smoke over its share
  # of every registered variant x shipping design language x color scheme x
  # typography profile x display mode, in Node with no browser, then the
  # browser smoke over its share of a wider sample: every pack at least once
  # per variant and display mode, and a seeded draw up to its budget, each
  # loaded on a plain production build under the demo profile, with a
  # screenshot. Each failure is a record naming its pack, axis, variant,
  # display mode, and tuple. The timeout is plan.ts's shardTimeoutMinutes(),
  # its fixed part and both steps at budget, twice over; a plan over budget
  # fails at its first step instead.
  catalog-full:
    name: catalog-full (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        # The install action from this same checkout; actionlint rejects the `$/` form.
        uses: ./.github/actions/install # zizmor: ignore[self-repository]
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm --filter @portfolio/web build:registry
        run: pnpm --filter @portfolio/web build:registry
      - name: pnpm ci:catalog-static (shard ${{ matrix.shard }}/4)
        env:
          CATALOG_SHARD: ${{ matrix.shard }}/4
          CI_REPRO_COMMAND: CATALOG_SHARD=${{ matrix.shard }}/4 pnpm ci:catalog-static
        run: pnpm ci:catalog-static
      - name: pnpm build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: pnpm ci:catalog-full (shard ${{ matrix.shard }}/4)
        if: ${{ !cancelled() }}
        env:
          CATALOG_SHARD: ${{ matrix.shard }}/4
          CI_REPRO_COMMAND: CATALOG_SHARD=${{ matrix.shard }}/4 pnpm ci:catalog-full
        run: pnpm ci:catalog-full
      - name: Failure summary
        if: ${{ always() }}
        run: node ci/summarize.mjs
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-catalog-full-${{ matrix.shard }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: report
    needs: [links, quality-full, quality-verdict, catalog-full]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    # It downloads every job's reports, the six quality shards' among them.
    timeout-minutes: 15
    permissions:
      contents: read # check out the reporter
      issues: write # open, comment on, and close the rolling report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/report-issue.mjs
            ci/summarize.mjs
            ci/lib/
          sparse-checkout-cone-mode: false
      # A missing artifact mustn't stop the report: a job that never ran
      # uploads none.
      - name: Download the jobs' reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-*
          path: ${{ runner.temp }}/reports
      - name: Open, update, or close the report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # The jobs this run skips by design: links, on every night but Monday.
          EXPECTED_SKIPS: ${{ github.event.schedule != '23 6 * * 1' && 'links' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORTS: ${{ runner.temp }}/reports
        run: node ci/report-issue.mjs --records "$REPORTS"
