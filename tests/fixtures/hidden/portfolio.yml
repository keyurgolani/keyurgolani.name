# Harness fixture: sections the site document hides, and data from a content
# extension the host doesn't register: a section of its own, and entries on
# the identity, a link, a section, and an item. Records only a hidden section
# lists, their media, the thesis and the other parts of the practice and the
# contact record only a hidden section places, and a hidden github section's
# snapshot are gone from what visitors get too. So are private works,
# evidence, and media wherever they're named: in a visible section, on a
# visible work, in a custom item, and in the curation lists, and the
# repository the visible github section excludes. snapshots/github.json holds
# both github sections' records. Each holds a canary-hidden- marker, in its id
# where it has one, that must never reach a visitor: not the page, its RSC
# payload, its JSON-LD, or the feed. The hidden chronology and practice
# sections come before the visible ones the JSON-LD reads, so one that leaked
# would change what it says. In version 3 a part of the practice shows
# wherever a visible section places it, so the hidden skill sits in the tools
# part, which only a hidden section places. .test hosts only.
schemaVersion: 3
locale: en-GB
direction: ltr

identity:
  name: Rowan Hidden
  tagline: Builds calm software.
  extensions:
    '@other/portfolio-x':
      note: canary-hidden-extension

links:
  - platform: website
    url: https://rowan.test
    label: Website
    extensions:
      '@other/portfolio-x':
        note: canary-hidden-link

signature: canary-hidden-private-work
featured: [notes-on-visible-things, canary-hidden-private-featured]
proof: [plain-award, canary-hidden-private-evidence]
archive: [canary-hidden-private-archived]

practice:
  thesis: canary-hidden-thesis
  skills:
    - items: [Accessibility, TypeScript]
  tools:
    - items:
        - name: canary-hidden-skill
  services:
    - items:
        - name: canary-hidden-practice

works:
  - id: notes-on-visible-things
    title: Notes on visible things
    medium: writing
    url: https://rowan.test/visible
    publishedAt: '2026-01-02'
    summary: An essay every visitor sees.
    media:
      - asset: canary-hidden-private-shot
        caption: canary-hidden-private-shot-caption
  - id: canary-hidden-essay
    title: canary-hidden-essay
    medium: writing
    url: https://rowan.test/canary-hidden-url
    publishedAt: '2026-02-03'
    summary: canary-hidden-summary
  - id: canary-hidden-record
    slug: canary-hidden-record-slug
    title: canary-hidden-record
    medium: writing
    publishedAt: '2026-03-04'
    summary: canary-hidden-record-summary
    cover:
      asset: canary-hidden-media-cover
      caption: canary-hidden-media
    caseStudy:
      challenge: canary-hidden-record-challenge
  - id: canary-hidden-private-work
    slug: canary-hidden-private-slug
    title: canary-hidden-private
    medium: writing
    visibility: private
    publishedAt: '2026-04-05'
    summary: canary-hidden-private-summary
    cover:
      asset: canary-hidden-private-cover
    caseStudy:
      challenge: canary-hidden-private-challenge
  - id: canary-hidden-private-featured
    title: canary-hidden-private-featured
    medium: writing
    visibility: private
  - id: canary-hidden-private-archived
    title: canary-hidden-private-archived
    medium: writing
    visibility: private

evidence:
  - id: plain-award
    type: award
    title: A plain award
  - id: canary-hidden-private-evidence
    type: award
    title: canary-hidden-private-evidence
    visibility: private
  - id: canary-hidden-evidence
    type: award
    title: canary-hidden-evidence

chronology:
  - id: canary-hidden-role-canary-hidden-organization
    kind: role
    title: canary-hidden-role
    organization: canary-hidden-organization
    period: { start: '2025-01' }
  - id: staff-engineer-calm-co
    kind: role
    title: Staff engineer
    organization: Calm Co
    period: { start: '2023-04' }
    extensions:
      '@other/portfolio-x':
        note: canary-hidden-item

media:
  - id: canary-hidden-media-cover
    kind: image
    source: hidden/canary-hidden-media.png
    alt: canary-hidden-media
    credit: canary-hidden-media
  - id: canary-hidden-private-cover
    kind: image
    source: hidden/canary-hidden-private.png
    visibility: private
    alt: canary-hidden-private-media
  - id: canary-hidden-private-shot
    kind: image
    source: hidden/canary-hidden-private-shot.png
    visibility: private
    alt: canary-hidden-private-shot

contact:
  message: canary-hidden-contact

sections:
  - kind: hero
    id: top
    tagline: I build calm software.

  - kind: chronology
    id: roles-draft
    title: canary-hidden-roles
    items: [canary-hidden-role-canary-hidden-organization]

  - kind: chronology
    id: work
    title: Work
    items: [staff-engineer-calm-co]

  - kind: practice
    id: skills-draft
    title: canary-hidden-skills
    part: tools

  - kind: practice
    id: services-draft
    title: canary-hidden-services
    part: services

  - kind: practice
    id: thesis-draft
    title: canary-hidden-thesis-title
    part: thesis

  - kind: practice
    id: skills
    title: Skills
    part: skills

  - kind: works
    id: essays
    title: Essays
    extensions:
      '@other/portfolio-x':
        note: canary-hidden-section
    items: [notes-on-visible-things, canary-hidden-private-work]

  - kind: works
    id: drafts
    title: canary-hidden-title
    items: [canary-hidden-essay, canary-hidden-record]

  - kind: evidence
    id: proof
    title: Proof
    items: [plain-award, canary-hidden-private-evidence]

  - kind: evidence
    id: evidence-draft
    title: canary-hidden-evidence-title
    items: [canary-hidden-evidence]

  - kind: custom
    id: notes
    title: Notes
    items:
      - title: A plain note
        evidence: [canary-hidden-private-evidence]
        media:
          - asset: canary-hidden-private-shot

  - kind: github
    id: code
    title: Code
    username: rowan-hidden
    excludeRepos: [canary-hidden-excluded]

  - kind: github
    id: github-draft
    title: canary-hidden-github-title
    username: canary-hidden-github-user

  - kind: '@other/portfolio-x/gallery'
    id: gallery
    title: canary-hidden-gallery
    data:
      items:
        - caption: canary-hidden-gallery-item

  - kind: contact
    id: contact
    title: canary-hidden-contact-title
