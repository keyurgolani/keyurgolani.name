# Harness fixture: Editorial in a scheme and preset that aren't its defaults,
# motion always reduced, and the drafts section hidden.
schemaVersion: 2
appearance:
  variant: editorial
  designLanguage: platform-neutral
  colorScheme: noir
  typography: modernist
  displayMode: dark
visitorControls:
  variant: locked
  designLanguage: locked
  colorScheme: selectable
  typography: locked
  displayMode: selectable
motionPolicy: reduce
features:
  feed: true
sections:
  drafts:
    hidden: true
