<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A dialog that opens late and won't close, known-bad</title>
    <!-- It opens half a second after Enter, as one that fetches first might, and Escape doesn't close it. -->
    <style>
      :focus-visible {
        outline: 2px solid #000;
        outline-offset: 2px;
      }
      [role='dialog'][hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A slow dialog</h1>
      <button type="button" aria-haspopup="dialog" id="open">Open</button>
      <div role="dialog" aria-modal="true" aria-label="Settings" id="dialog" hidden>
        <button type="button" id="close">Close</button>
      </div>
    </main>
    <script>
      const dialog = document.getElementById('dialog');
      const close = document.getElementById('close');
      document.getElementById('open').addEventListener('click', () =>
        setTimeout(() => {
          dialog.hidden = false;
          close.focus();
        }, 500),
      );
      close.addEventListener('keydown', (event) => event.key === 'Tab' && event.preventDefault());
    </script>
  </body>
</html>
