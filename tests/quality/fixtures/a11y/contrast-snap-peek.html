<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A title a snapping strip leaves cut under its end fade, known-good</title>
    <!--
      A strip that snaps on x, mandatory, as Horizontal Cinema's does without script: each item
      90 % of its width, so the next one peeks in at the inline end under the strip's end fade
      (mask-image), wholly transparent past 88 % of the strip. The strip rests on the first item.
      The next item's title is cut by the viewport, and what of it is in view lies where the fade
      is wholly transparent. Its words are an inline span in the heading, as Horizontal Cinema's
      headline is, so their box is the words' own, not the item's width. A scroll into view that
      makes the smallest scroll to show the words moves the strip less than half an item, and the
      mandatory snap takes it back to the first item, so they are still cut there: read as that
      sliver, none of their glyphs paints.
      Read once its own snap area, the item, is scrolled into view by its scroll-snap-align, the
      title is wholly in view, dark on a light ground, about 15:1, and passes.
    -->
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Arial,
          'Liberation Sans',
          Helvetica,
          sans-serif;
        background: #fff;
        color: #222;
      }
      main {
        padding: 1rem;
      }
      .strip {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        mask-image: linear-gradient(to right, #000 80%, transparent 88%);
      }
      .item {
        flex: 0 0 90%;
        box-sizing: border-box;
        padding: 1rem;
        scroll-snap-align: start;
        background: linear-gradient(180deg, #fff, #f6f6f6);
      }
      .item h2 {
        margin: 0;
        font-size: 1.5rem;
        white-space: nowrap;
        color: #222;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A strip</h1>
      <div class="strip">
        <section class="item"><p>A word in the item the strip rests on.</p></section>
        <section class="item">
          <h2><span>Fun facts about the work and its making</span></h2>
        </section>
      </div>
    </main>
  </body>
</html>
