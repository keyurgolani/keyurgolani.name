<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A page whose script didn't arrive, still saying it's loading</title>
    <!--
      Known-bad (#11): a surface that declares requiresScript whose script
      failed to load, with its alert and Reload, but whose loading line still
      says aria-busy, so it never settles.
    -->
  </head>
  <body>
    <a href="#content">Skip to the task</a>
    <h1>Portfolio Studio</h1>
    <main>
      <div id="content" tabindex="-1"></div>
      <p aria-busy="true">Loading the draft…</p>
      <div role="alert">
        <p>Studio couldn't load. Check your connection, then reload Studio.</p>
        <button type="button">Reload Studio</button>
      </div>
    </main>
  </body>
</html>
