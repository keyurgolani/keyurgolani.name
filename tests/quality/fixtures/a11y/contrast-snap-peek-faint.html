<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A faint title a snapping strip leaves cut, wholly in view once snapped, known-bad</title>
    <!--
      contrast-snap-peek.html with the title at #bbb on the light ground, about 1.9:1. Snapped
      into view and read wholly in view, it fails there: the snap into view masks nothing.
    -->
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Arial,
          'Liberation Sans',
          Helvetica,
          sans-serif;
        background: #fff;
        color: #222;
      }
      main {
        padding: 1rem;
      }
      .strip {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        mask-image: linear-gradient(to right, #000 80%, transparent 88%);
      }
      .item {
        flex: 0 0 90%;
        box-sizing: border-box;
        padding: 1rem;
        scroll-snap-align: start;
        background: linear-gradient(180deg, #fff, #f6f6f6);
      }
      .item h2 {
        margin: 0;
        font-size: 1.5rem;
        white-space: nowrap;
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A strip</h1>
      <div class="strip">
        <section class="item"><p>A word in the item the strip rests on.</p></section>
        <section class="item"><h2>Fun facts about the work and its making</h2></section>
      </div>
    </main>
  </body>
</html>
