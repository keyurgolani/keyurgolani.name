<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A word a timeout turns and a snap turns back, both after its shots, known-good</title>
    <!--
      A tab bar as Flux's when a stretch is cut short and the drop snaps on: as the bar comes into
      view, a dark drop's clip opens under Work over 1.8 s, and a timeout turns Work's ink light at
      60 % of that, as the clip's edge passes the word's centre. At 70 % the drop snaps to Writing,
      the bar's current tab, at once: Work's ink goes back to dark, and Writing's turns light. At
      rest a visitor sees dark ink on the bar's light gradient under Work and light ink on the dark
      drop under Writing: about 15:1 both.
      Read on its own, Work's color is read straight after the scroll that starts the drop: dark.
      Its shots end the drop's transition (animations: 'disabled'), so the drop is under Work, and
      the page's two turns come in the wait for the time the transition had left. Its color, read
      again after that, is dark once more, the same as before its shots, though the page turned it
      and back after them, and the dark ink over the dark drop shot is about 1:1. The turns end
      more than QUIET_MS before the wait for its ancestors to hold still, so that wait has nothing
      to wait for. Read again at rest, it passes.
    -->
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Arial,
          'Liberation Sans',
          Helvetica,
          sans-serif;
        background: #fff;
        color: #222;
      }
      main {
        padding: 1rem 1rem 50vh;
      }
      .bar {
        position: relative;
        display: flex;
        align-items: center;
        margin-top: 150vh;
        padding: 0.25rem;
        background: linear-gradient(90deg, #fff, #f6f6f6);
      }
      .drop {
        position: absolute;
        inset-block: 0.25rem;
        inset-inline-start: 0.25rem;
        inline-size: 12rem;
        background: #222;
        clip-path: inset(0 100% 0 0);
        transition: clip-path 1.8s linear;
      }
      .bar[data-at='work'] .drop {
        clip-path: inset(0 50% 0 0);
      }
      .bar[data-at='writing'] .drop {
        clip-path: inset(0 0 0 50%);
        transition: none;
      }
      .tab {
        position: relative;
        display: inline-block;
        box-sizing: border-box;
        inline-size: 6rem;
        padding: 0.5rem 1rem;
        color: #222;
        text-decoration: none;
      }
      .tab[data-under] {
        color: #fbfbfb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tabs</h1>
      <nav class="bar" id="bar">
        <span class="drop"></span>
        <a class="tab" id="work" href="#bar"><span class="word">Work</span></a>
        <a class="tab" id="writing" href="#bar"><span class="word">Writing</span></a>
      </nav>
    </main>
    <script>
      const bar = document.getElementById('bar');
      const work = document.getElementById('work');
      const writing = document.getElementById('writing');
      let seen = false;
      new IntersectionObserver((entries) => {
        if (seen || !entries.some((entry) => entry.isIntersecting)) return;
        seen = true;
        // The stretch under Work, its turn at 60 % of the drop's 1.8 s, then the snap to Writing.
        bar.setAttribute('data-at', 'work');
        setTimeout(() => work.setAttribute('data-under', ''), 1080);
        setTimeout(() => {
          bar.setAttribute('data-at', 'writing');
          work.removeAttribute('data-under');
          writing.setAttribute('data-under', '');
        }, 1260);
      }).observe(bar);
    </script>
  </body>
</html>
