<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A link a glide leaves out of view, known-bad</title>
    <!--
      keyboard-glide-stall.html whose glide stops half way for good, the far link still out of
      view: once the page has held still 600 ms it's judged there, and fails.
    -->
    <style>
      :focus-visible {
        outline: 2px solid #000;
        outline-offset: 2px;
      }
      body {
        margin: 0;
        font:
          16px/1.5 Arial,
          'Liberation Sans',
          Helvetica,
          sans-serif;
      }
      main {
        padding: 1rem;
      }
      .strip {
        display: flex;
        gap: 1rem;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .strip a {
        flex: 0 0 12rem;
        padding: 0.5rem;
        color: #222;
      }
      .gap {
        flex: 0 0 2800px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A strip of links</h1>
      <div class="strip" id="strip">
        <a href="#one">One</a>
        <a href="#two">Two</a>
        <span class="gap"></span>
        <a href="#far" id="far">Far along the strip</a>
      </div>
    </main>
    <script>
      const strip = document.getElementById('strip');
      let rest = strip.scrollLeft;
      // A glide the page drives itself: where focus's own scroll took the strip, put back, then
      // half way at 50 ms, where it stops.
      strip.addEventListener('focusin', () => {
        const end = strip.scrollLeft;
        if (end === rest) return;
        const from = rest;
        rest = end;
        strip.scrollLeft = from;
        setTimeout(() => {
          strip.scrollLeft = from + (end - from) / 2;
        }, 50);
      });
    </script>
  </body>
</html>
