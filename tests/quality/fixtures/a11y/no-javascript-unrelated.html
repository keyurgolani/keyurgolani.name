<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A page that needs JavaScript, and says something else</title>
    <!--
      Known-bad (#11): a surface that declares requiresScript whose #content,
      with JavaScript off, shows text that never says it needs JavaScript.
    -->
  </head>
  <body>
    <a href="#content">Skip to the task</a>
    <h1>Portfolio Studio</h1>
    <main>
      <div id="content" tabindex="-1">
        <p>Where things stand</p>
      </div>
    </main>
  </body>
</html>
