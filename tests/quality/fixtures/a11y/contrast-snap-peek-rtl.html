<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>A title a right-to-left snapping strip leaves cut under its end fade, known-good</title>
    <!--
      contrast-snap-peek.html right to left: the strip flows from the right, so the next item
      peeks in at the left edge, under a fade at that end, and the title is cut there. Snapped
      into view by its scroll-snap-align (start, the right in this direction), it passes.
    -->
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Arial,
          'Liberation Sans',
          Helvetica,
          sans-serif;
        background: #fff;
        color: #222;
      }
      main {
        padding: 1rem;
      }
      .strip {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        mask-image: linear-gradient(to left, #000 80%, transparent 88%);
      }
      .item {
        flex: 0 0 90%;
        box-sizing: border-box;
        padding: 1rem;
        scroll-snap-align: start;
        background: linear-gradient(180deg, #fff, #f6f6f6);
      }
      .item h2 {
        margin: 0;
        font-size: 1.5rem;
        white-space: nowrap;
        color: #222;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A strip</h1>
      <div class="strip">
        <section class="item"><p>A word in the item the strip rests on.</p></section>
        <section class="item">
          <h2><span>Fun facts about the work and its making</span></h2>
        </section>
      </div>
    </main>
  </body>
</html>
