<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A see-through-to-the-pointer footer, known-bad</title>
    <!-- The footer takes no pointer events, so elementFromPoint misses it, but it still covers the link. -->
    <style>
      :focus-visible {
        outline: 2px solid #000;
        outline-offset: 2px;
      }
      footer {
        position: fixed;
        inset: auto 0 0 0;
        height: 160px;
        background: #222;
        color: #fff;
        pointer-events: none;
      }
      .spacer {
        height: 1600px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A link under a footer that ignores the pointer</h1>
      <div class="spacer"></div>
      <p><a href="#below" id="below">Below the fold</a></p>
    </main>
    <footer><p>A fixed footer</p></footer>
  </body>
</html>
