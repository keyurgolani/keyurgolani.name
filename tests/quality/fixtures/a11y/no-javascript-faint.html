<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A page that needs JavaScript, and says so too faintly to read</title>
    <!--
      Known-bad (#11): a surface that declares requiresScript whose notice,
      with JavaScript off, is #ccc on white, under AA contrast. axe reads it
      as a reader without JavaScript has it.
    -->
  </head>
  <body>
    <a href="#content">Skip to the task</a>
    <h1>Portfolio Studio</h1>
    <main>
      <div id="content" tabindex="-1">
        <noscript>
          <p style="color: #ccc; background: #fff">
            Studio needs JavaScript. Turn it on, then reload.
          </p>
        </noscript>
      </div>
    </main>
  </body>
</html>
