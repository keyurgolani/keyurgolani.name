<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      A word whose ink a chain of timeouts turns after its drop's transition has ended, known-good
    </title>
    <!--
      A tab bar as Flux's at its snap (row 25's residual, #211): as the bar comes into view, a dark
      drop lands under the tab over a short 100 ms transition, and the tab's ink turns light only
      after a chain of timeouts, each 300 ms apart: the bar marks the move, then the snap, then the
      tab is under (about 900 ms in all). A visitor sees dark ink on the bar's light ground, then
      light ink on the dark drop: about 15:1 both ways.
      The sampler scrolls the bar into view, which starts the chain, and reads the word's color
      straight after: dark. Its shots end the drop's transition (animations: 'disabled'), so the
      drop is under the word, and what the shots ended had only 100 ms left, so the wait for that is
      over long before the tab turns: the dark ink read before, and again after the shots, over the
      dark drop shot, is about 1:1. Read once the word's ancestors' attributes have held still, the
      word is light, and read once more, it passes.
    -->
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Arial,
          'Liberation Sans',
          Helvetica,
          sans-serif;
        background: #fff;
        color: #222;
      }
      main {
        padding: 1rem 1rem 50vh;
      }
      .bar {
        position: relative;
        display: flex;
        align-items: center;
        margin-top: 150vh;
        padding: 0.25rem;
        background: #fff;
      }
      .drop {
        position: absolute;
        inset-block: 0.25rem;
        inset-inline-start: 0.25rem;
        inline-size: 6rem;
        background: #222;
        clip-path: inset(0 100% 0 0);
        transition: clip-path 0.1s linear;
      }
      .bar[data-move] .drop {
        clip-path: inset(0 0 0 0);
      }
      .tab {
        position: relative;
        display: inline-block;
        inline-size: 4rem;
        padding: 0.5rem 1rem;
        color: #222;
        text-decoration: none;
      }
      .tab[data-under] {
        color: #fbfbfb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tabs</h1>
      <nav class="bar" id="bar">
        <span class="drop"></span>
        <a class="tab" id="tab" href="#bar"><span class="word">Work</span></a>
      </nav>
    </main>
    <script>
      const bar = document.getElementById('bar');
      const tab = document.getElementById('tab');
      let seen = false;
      new IntersectionObserver((entries) => {
        if (seen || !entries.some((entry) => entry.isIntersecting)) return;
        seen = true;
        // The drop lands (its 100 ms transition), then the chain: the move, the snap, the turn.
        bar.setAttribute('data-move', 'stretch');
        setTimeout(() => bar.setAttribute('data-move', 'snap'), 300);
        setTimeout(() => bar.setAttribute('data-move', 'land'), 600);
        setTimeout(() => tab.setAttribute('data-under', ''), 900);
      }).observe(bar);
    </script>
  </body>
</html>
