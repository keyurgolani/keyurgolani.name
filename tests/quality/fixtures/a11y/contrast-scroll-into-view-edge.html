<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Where a scroll into view leaves words cut at a strip's end, known-good</title>
    <!--
      The scroll the contrast sampler's own path makes before it reads an element, as
      contrast-snap-peek.html needs it: Playwright's scrollIntoViewIfNeeded(), for words cut at a
      strip's end. Two strips as that fixture's, the next item's words an inline span cut by the
      viewport. The first strip doesn't snap: the scroll is the smallest that shows the words, so
      their end meets the strip's. The second snaps on x, mandatory: that scroll moves it less than
      half an item, and the snap takes it back to the first item, so the words are still cut. A
      scroll into view that centred the words, or one that snapped to their item, would leave
      contrast-snap-peek.html's known-good read whole without its snap into view, so its red
      would pass at the red: this case fails first.
    -->
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 Arial,
          'Liberation Sans',
          Helvetica,
          sans-serif;
        background: #fff;
        color: #222;
      }
      main {
        padding: 1rem;
      }
      .strip {
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
      }
      #snapping {
        scroll-snap-type: x mandatory;
      }
      .item {
        flex: 0 0 90%;
        box-sizing: border-box;
        padding: 1rem;
        scroll-snap-align: start;
        background: linear-gradient(180deg, #fff, #f6f6f6);
      }
      .item h2 {
        margin: 0;
        font-size: 1.5rem;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Two strips</h1>
      <div class="strip" id="plain">
        <section class="item"><p>A word in the item the strip rests on.</p></section>
        <section class="item">
          <h2><span id="plain-words">Fun facts about the work and its making</span></h2>
        </section>
      </div>
      <div class="strip" id="snapping">
        <section class="item"><p>A word in the item the strip rests on.</p></section>
        <section class="item">
          <h2><span id="snapping-words">Fun facts about the work and its making</span></h2>
        </section>
      </div>
    </main>
  </body>
</html>
