<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A page whose script didn't arrive, with no way to try again</title>
    <!--
      Known-bad (#11): a surface that declares requiresScript whose script
      failed to load, with an alert that says so and no control in it.
    -->
  </head>
  <body>
    <a href="#content">Skip to the task</a>
    <h1>Portfolio Studio</h1>
    <main>
      <div id="content" tabindex="-1"></div>
      <div role="alert">
        <p>Studio couldn't load. Check your connection, then reload the page.</p>
      </div>
    </main>
  </body>
</html>
