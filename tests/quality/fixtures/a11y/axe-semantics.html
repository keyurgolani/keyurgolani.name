<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Missing names, small targets, and low contrast, known-bad</title>
    <!--
      Three of axe's WCAG 2.2 AA rules: an icon button with no name
      (button-name), two 12px buttons side by side (target-size), and gray
      text on white (color-contrast).
    -->
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        background: #fff;
        color: #111;
      }
      .tiny {
        width: 12px;
        height: 12px;
        padding: 0;
        margin: 0;
        border: 1px solid #333;
      }
      .faint {
        color: #b0b0b0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A toolbar</h1>
      <button type="button">
        <svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6" /></svg>
      </button>
      <p>
        <button type="button" class="tiny" aria-label="Previous"></button
        ><button type="button" class="tiny" aria-label="Next"></button>
      </p>
      <p class="faint">Low-contrast help text.</p>
    </main>
  </body>
</html>
