<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A page that needs JavaScript, and doesn't say so</title>
    <!--
      Known-bad (#11): a surface that declares requiresScript and, with
      JavaScript off, shows only its loading line, with nothing in #content
      to say it needs JavaScript.
    -->
  </head>
  <body>
    <a href="#content">Skip to the task</a>
    <h1>Portfolio Studio</h1>
    <main>
      <div id="content" tabindex="-1"></div>
      <p aria-busy="true">Loading the draft…</p>
    </main>
  </body>
</html>
