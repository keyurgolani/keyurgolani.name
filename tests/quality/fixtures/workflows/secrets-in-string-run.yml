# Known bad (#11, Slice 1, item 13): a secret in a run: step, behind a }} inside
# a quoted string. The runner ends the expression at the last }}, so format()
# reads the secret. Its token is fine, so it fails for the secret alone.
name: preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ format('}}{0}', secrets.DEPLOY_TOKEN) }}"
