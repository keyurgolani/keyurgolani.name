# Known bad (#11, Slice 1, item 13): a job pull requests run that references a
# secret. Its token is fine, so it fails for the secret alone.
name: preview
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - run: ./deploy-preview.sh
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
