# Known bad (#11, Slice 1, item 13): a job pull requests run that gets
# pull-requests: write, more than contents: read and actions: read.
name: comment
on:
  pull_request:
permissions:
  contents: read
jobs:
  comment:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - run: echo comment
