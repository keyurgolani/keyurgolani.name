# Known bad (#11, Slice 1, item 13): a secret in the workflow's env, which every
# job inherits, behind a }} inside a quoted string. Its job's token is fine, so
# it fails for the secret alone.
name: preview
on:
  pull_request:
permissions:
  contents: read
env:
  DEPLOY: ${{ format('}}{0}', secrets.DEPLOY_TOKEN) }}
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - run: ./deploy-preview.sh
