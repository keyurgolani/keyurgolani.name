# Known bad (#11, VR2): fixture-scheme-experimental-low-contrast's large-text
# contrast failure, put in as decorative by its selector. Large text is text
# under 1.4.3, so decorative can't excuse it any more than normal text.
version: 1
exceptions:
  - id: low-contrast-headline-decorative
    kind: decorative
    gate: contrast
    rule: large-text
    selector: .headline
    owner: keyurgolani
    rationale: The headline is ornament, so it may read at 2.68:1.
    affectedUsers: Low-vision readers.
    fallback: None.
    trackingIssue: '#11'
    created: '2026-10-20'
    expires: '2026-12-15'
    scope:
      surface: fallback
      route: /
      tuple: platform-neutral/fixture-scheme-experimental-low-contrast/humanist-ui/light
      viewport: 1440x900
      preferenceMode: default
falsePositives: []
