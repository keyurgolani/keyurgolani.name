# Known bad (#11, VR2): fixture-scheme-experimental-low-contrast's text contrast
# failure, put in as decorative by its selector. Decorative can't excuse text
# contrast, since a pack's text roles carry the page's content.
version: 1
exceptions:
  - id: low-contrast-muted-decorative
    kind: decorative
    gate: contrast
    rule: text
    selector: .muted
    owner: keyurgolani
    rationale: The muted text is ornament, so it may read at 2.68:1.
    affectedUsers: Low-vision readers.
    fallback: None.
    trackingIssue: '#11'
    created: '2026-10-20'
    expires: '2026-12-15'
    scope:
      surface: fallback
      route: /
      tuple: platform-neutral/fixture-scheme-experimental-low-contrast/humanist-ui/light
      viewport: 1440x900
      preferenceMode: default
falsePositives: []
