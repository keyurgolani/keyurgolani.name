# Known good (#11, Slice 1, item 12): one entry of each kind quality/exceptions.yml
# holds, and a false positive, all valid on the fixtures' run date, 2026-11-01.
version: 1
exceptions:
  - id: login-primary-target
    kind: above-aa
    gate: targets
    rule: primary
    owner: keyurgolani
    rationale: The sign-in button is 40px tall at 390px until #8's sticky bar lands.
    affectedUsers: Touch users on narrow phones, who get a 40px target where 44px is the floor.
    fallback: The button still clears the 24px and 32px floors, and Enter submits the form.
    trackingIssue: '#8'
    created: '2026-10-20'
    expires: '2026-12-15'
    scope:
      surface: login
      route: /studio/login
      tuple: platform-neutral/warm-parchment/humanist-ui/light
      viewport: 390x844
      inputMode: touch
  - id: fallback-decorative-watermark
    kind: decorative
    gate: axe
    rule: color-contrast
    owner: keyurgolani
    rationale: The page number behind the hero is a watermark that carries no content.
    affectedUsers: Nobody loses content; low-vision users see a faint numeral.
    fallback: The same number is in the heading the watermark sits behind.
    trackingIssue: '#13'
    created: '2026-10-25'
    expires: '2027-01-15'
    selector: main .hero-watermark
    scope:
      surface: fallback
      route: /
      tuple: platform-neutral/warm-parchment/humanist-ui/light
      viewport: 1440x900
      preferenceMode: default
  - id: fallback-lcp-ceiling
    kind: timing
    gate: vitals
    rule: lcp
    owner: keyurgolani
    rationale: The fallback composition's hero image misses the release ceiling on the throttled profile until #10's renditions land.
    affectedUsers: Visitors on slow phones, who wait longer for the hero.
    fallback: The headline renders from the server first, so the page reads before the image arrives.
    trackingIssue: '#10'
    created: '2026-10-28'
    expires: '2026-12-31'
    scope:
      surface: fallback
      route: /
      tuple: platform-neutral/warm-parchment/humanist-ui/light
      viewport: 390x844
  - id: login-dialog-escape-flake
    kind: quarantine
    gate: keyboard
    rule: dialog-escape
    owner: keyurgolani
    rationale: The Escape test flakes when the dialog's open transition overlaps the key press.
    affectedUsers: None while quarantined; the test still runs and reports.
    fallback: The close button closes the dialog.
    trackingIssue: '#11'
    created: '2026-10-30'
    expires: '2026-11-05'
    scope:
      surface: login
      route: /studio/login
      tuple: platform-neutral/warm-parchment/humanist-ui/light
      viewport: 1440x900
      preferenceMode: default
falsePositives:
  - id: login-badge-contrast
    rule: color-contrast
    selector: main .status-badge
    manualRun: 2026-10-20-login-voiceover
    axe: 4.11.0
