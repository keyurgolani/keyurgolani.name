# Harness overlay on compose.yml: the app under owner with the password
# provider, behind the proxy, for #2's security suite
# (`pnpm --filter @portfolio/web test:security:proxy`). proxy-stack.mjs adds
# it with its `owner` option and supplies these variables. The app trusts one
# proxy to append to X-Forwarded-For by default, the fixture's one. Its data
# directory is a volume of the project's own, removed with it.
services:
  app:
    environment:
      PORTFOLIO_PROFILE: owner
      PORTFOLIO_TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      PORTFOLIO_DATA_DIR: /var/lib/portfolio
      PORTFOLIO_AUTH_PASSWORD_HASH_FILE: /run/owner-secret/owner_password_hash
    volumes:
      - ${OWNER_SECRET_DIR:?set OWNER_SECRET_DIR to the directory holding the hash}:/run/owner-secret:ro
      - data:/var/lib/portfolio

volumes:
  data: {}
