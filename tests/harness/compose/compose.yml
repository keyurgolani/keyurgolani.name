# Harness fixture: the image under test behind a Caddy HTTPS proxy whose
# certificates come from Caddy's own local CA (tls internal). The app sits on an
# internal network with no route out; only the proxy publishes a port, and only
# on 127.0.0.1. Start it through tests/harness/proxy-stack.mjs (or
# `pnpm ci:proxy`), which supplies a unique project name and these variables.
services:
  app:
    image: ${PORTFOLIO_IMAGE:?set PORTFOLIO_IMAGE to the image under test}
    environment:
      TZ: UTC
    volumes:
      - ${PORTFOLIO_DATA_DIR:?set PORTFOLIO_DATA_DIR to the fixture data directory}:/data:ro
    networks:
      - internal

  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    depends_on:
      - app
    ports:
      - '127.0.0.1:${PROXY_PORT:?set PROXY_PORT to a free port}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - internal
      - edge

networks:
  internal:
    internal: true
  edge: {}
