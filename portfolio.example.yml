# ── Works: things made ───────────────────────────────────────────────────────
# medium is interface, system, software, photography, image-series, writing,
# research, music, audio-video, or object. A work with a caseStudy needs a
# slug, its route /work/<slug>
works:
  - id: postmortem-template-kit
    slug: postmortem-template-kit
    title: Postmortem Template Kit
    medium: software
    summary: An opinionated, batteries-included template kit for writing better incident postmortems.
    description: |
      Three years of running postmortem reviews convinced me that the *template* is doing most of the work. This kit ships with twelve
      templates spanning availability, latency, security, and process incidents, plus a CLI that walks an author through the questions
      that don't get asked enough — *what was the smallest signal that was missed* and *what did the room assume that wasn't true*.

      Used at a dozen mid-size engineering teams and one government agency I'm not allowed to name.
    period: { start: 2022-01 }
    role: Author and maintainer
    tools: [TypeScript, Bun, Markdown]
    cover:
      asset: postmortem-template-kit-cover
    evidence: [srecon-practitioner-award, how-to-write-a-postmortem-that-doesn-t-make-things-worse]
    links:
      - url: https://github.com/anamika/postmortem-template-kit
        label: GitHub
      - url: https://postmortems.example.com
        label: Project site
    highlights:
      - 3,200+ GitHub stars
      - Cited in three SREcon talks
      - Plain-language explainer in The Pragmatic Engineer
    # Every field is Markdown and optional: write the ones your work has
    caseStudy:
      challenge: |
        Postmortems at Solstice were long, late, and defensive. Reviews argued about blame, the documents went unread, and the same
        classes of incident came back every quarter.
      context: |
        A real-time payments platform of thirty-eight services, three platform teams, and an incident-review meeting that most
        engineers dreaded.
      role: I wrote the templates and the CLI, and ran the first forty reviews with them.
      constraints: |
        No new process on top of on-call, nothing that needed a vendor, and documents a tired engineer could finish within a week.
      decisions:
        - decision: Ask questions instead of offering fields.
          rationale: A field invites a one-word answer; a question like *what did we assume* invites the thinking the review needs.
          alternatives: A form with required fields, which earlier attempts had tried and abandoned.
        - decision: Edit the document in the review, not before it.
          rationale: The first draft is always too sure of itself. Editing together moves the argument from blame to wording.
      evidence: |
        Review attendance went from roughly half the invited engineers to nearly all of them, and every postmortem has been
        published within seven days since the kit's first quarter.
      outcomes: |
        Mean time to detect fell from fourteen minutes to three after the reviews rebuilt the alerting taxonomy. The kit is now open
        source and used well beyond Solstice.
      reflection: |
        The templates mattered less than the questions in them. I'd start with the questions next time and let each team find its
        own form.
  - id: small-traces
    title: small-traces
    medium: software
    summary: A minimalist tracing library for understanding latency in serverless workloads — designed for legibility over completeness.
    description: |
      OpenTelemetry is a wonderful thing, but for the kind of system where you have eleven cold-started Lambdas and you want to know
      *which one* spent fourteen seconds doing nothing, it is overkill. small-traces ships in 800 lines of TypeScript, has zero
      dependencies, and prints traces as ASCII flame graphs.
    period: { start: 2024-06 }
    role: Author
    tools: [TypeScript, AWS Lambda]
    cover:
