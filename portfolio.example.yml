  - kind: lede
    id: about
    title: About
    body: |
      I work at the messy intersection of **distributed systems** and **organizational psychology** — the places where the engineering decisions
      depend more on how a team thinks than on what the database does. My day job is improving reliability for a payments platform that processes
      ten billion requests a day across thirty-eight services. My side projects are a long-running essay series on *system illegibility*, a
      podcast about the history of software incidents, and an open-source toolkit for writing better postmortems.

      Before this I spent five years at a search-and-discovery startup, where I learned that the hardest distributed-systems problem is usually
      whichever one your most senior engineer is currently afraid of. Before that, a research assistantship in formal verification taught me both
      that proofs scale poorly and that *the people writing them* scale even worse. I have not entirely recovered from this.

      I write because thinking on paper makes me a better engineer, and I speak because I want fewer people to have to learn the same lessons twice.

  - kind: now
    id: now
    title: Now
    asOf: 2026-04-15
    body: |
      I'm spending the first half of this year on three things: shipping a service-mesh migration without an incident; writing a book on the
      *anthropology of on-call*; and (slowly, very slowly) learning enough Carnatic music theory to embarrass myself at a kacheri.

